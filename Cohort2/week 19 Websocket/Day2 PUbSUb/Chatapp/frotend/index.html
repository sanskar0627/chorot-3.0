<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebSocket Chat</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: auto; }
    #chat { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin-top: 10px; }
    .msg { margin: 5px 0; }
    .self { color: blue; }
    .system { color: gray; font-style: italic; }
  </style>
</head>
<body>
  <h2>Chat App (WebSocket)</h2>

  <!-- Room actions -->
  <button id="createBtn">Create Room</button>
  <input type="text" id="joinCode" placeholder="Enter room code" />
  <button id="joinBtn">Join Room</button>
  <p id="roomInfo"></p>

  <!-- Chat UI -->
  <div id="chat"></div>
  <input type="text" id="messageInput" placeholder="Type a message" />
  <button id="sendBtn">Send</button>

  <script>
    let ws;
    let currentRoom = null;

    function logMessage(text, className = "msg") {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.className = className;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // Connect to WebSocket
    function connect() {
      ws = new WebSocket("ws://localhost:4040");

      ws.onopen = () => {
        logMessage("✅ Connected to server", "system");
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === "roomCreated") {
          currentRoom = msg.code;
          document.getElementById("roomInfo").textContent =
            "Created room: " + currentRoom;
          logMessage("Room created with code: " + currentRoom, "system");
        }

        else if (msg.type === "joined") {
          currentRoom = msg.code;
          document.getElementById("roomInfo").textContent =
            "Joined room: " + currentRoom;
          logMessage("Joined room: " + currentRoom, "system");
        }

        else if (msg.type === "chat") {
          logMessage("Friend: " + msg.text);
        }

        else if (msg.type === "error") {
          logMessage("❌ " + msg.message, "system");
        }
      };

      ws.onclose = () => {
        logMessage("🔌 Disconnected", "system");
      };
    }

    // Buttons
    document.getElementById("createBtn").onclick = () => {
      ws.send(JSON.stringify({ type: "create" }));
    };

    document.getElementById("joinBtn").onclick = () => {
      const code = document.getElementById("joinCode").value.trim();
      ws.send(JSON.stringify({ type: "join", code }));
    };

    document.getElementById("sendBtn").onclick = () => {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();
      if (text && currentRoom) {
        ws.send(JSON.stringify({ type: "chat", text }));
        logMessage("You: " + text, "self");
        input.value = "";
      }
    };

    // Start connection when page loads
    connect();
  </script>
</body>
</html>
